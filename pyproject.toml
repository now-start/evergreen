[project]
name = "evergreen"
version = "0.1.0"
description = "Evergreen Python backtest research toolkit"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=3.0.3",
    "upbit-sdk>=0.9.0",
]

[dependency-groups]
# Notebook/plotting/research-only tooling. Excluded from the container runtime via `uv sync --no-dev`.
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.0",
    "jupyterlab-widgets>=3.0.16",
    "matplotlib>=3.11.0",
    "notebook>=7.6.0",
]
