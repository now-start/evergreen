name: App CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evergreen_test
          POSTGRES_PASSWORD: evergreen_test
          POSTGRES_DB: evergreen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evergreen_test -d evergreen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVERGREEN_TEST_POSTGRESQL_URL: postgresql+asyncpg://evergreen_test:evergreen_test@127.0.0.1:5432/evergreen_test?ssl=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_trading_postgresql.py tests/test_database_transfer.py --no-cov

  app:
    needs: postgres
    uses: now-start/gitops/.github/workflows/reusable-python-app.yaml@main
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
