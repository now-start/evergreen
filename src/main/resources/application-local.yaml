spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: "jdbc:h2:mem:evergreen;MODE=MariaDB;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

eureka:
  client:
    enabled: false

otel:
  sdk:
    disabled: true

evergreen:
  trading:
    base-url: https://api.upbit.com
    access-key: ${UPBIT_ACCESS_KEY:local-access-key}
    secret-key: ${UPBIT_SECRET_KEY:local-secret-key}
    fee-rate: 0.0005
    interval: 1h
    execution-mode: PAPER
    markets: []
    candle-count: 400
    closed-candle-only: true
    signal-order-notional: 100000
    active-strategy-version: v6
    v5:
      regime-ema-len: 120
      atr-period: 18
      atr-mult-low-vol: 2.0
      atr-mult-high-vol: 3.0
      vol-regime-lookback: 40
      vol-regime-threshold: 0.6
      regime-band: 0.01
    v6:
      rule-scale: 0.124825
      buy-cutoff: 0.055
      sell-cutoff: 0.25
      dl-enabled: true

logging:
  level:
    org.hibernate.SQL: debug
